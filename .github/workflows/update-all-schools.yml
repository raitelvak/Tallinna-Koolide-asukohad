name: Update all Tallinn schools

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Collect all schools
        run: node scripts/scrape-all-schools.mjs

      - name: Commit school data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/schools.json
          git add src/data/failed-school-pages.json
          git diff --cached --quiet || git commit -m "Update all Tallinn schools"
          git push
