name: Update all Tallinn schools
on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 1 * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/scrape-all-schools.mjs
      - name: Commit school data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/schools.json
          git diff --cached --quiet || git commit -m "Update municipal, state and private schools"
          git push
